[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-light-python"
version = "0.1.0"
description = "Runnable structured-light and diffractive neural network simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[project.scripts]
structured-light-sim = "structured_light.cli:main"

[tool.setuptools.packages.find]
include = ["structured_light*"]
